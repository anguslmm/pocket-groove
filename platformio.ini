; Pocket Groove -- PlatformIO config for the M5Stack Cardputer-Adv (ESP32-S3 / Stamp-S3A, 8 MB flash)
;
;   Mac/PC, normal internet:   pio run -e cardputer-adv              (add -t upload to flash)
;   Cloud sandbox:             source tools/sandbox-pio-setup.sh && pio run -e cardputer-adv
;
; The same file works in both places. Everything is fetched from github.com
; (release assets + git tags), nothing from the PlatformIO registry, because the
; sandbox proxy blocks registry.platformio.org. Lines that are shaped by that are
; marked [sandbox] together with their stock (registry) equivalent.
;
; Toolchain this resolves to (verified build, 2026-11-11):
;   pioarduino platform-espressif32 55.03.312-1  ->  arduino-esp32 3.3.12, ESP-IDF v5.5.5,
;   xtensa-esp-elf GCC 14.2.0 (crosstool-NG esp-14.2.0_20260121), esptool 5.4.0,
;   C++ compiled as -std=gnu++2a (C++20), C as -std=gnu17.
;
; Outputs in .pio/build/cardputer-adv/: firmware.bin (app, 0x10000), bootloader.bin (0x0),
; partitions.bin (0x8000) and firmware.factory.bin -- a single merged image for offset 0x0
; that the platform builds automatically. Hand-rolled equivalent (byte-identical):
;   esptool --chip esp32s3 merge-bin -o merged.bin --flash-mode dio --flash-freq 80m --flash-size 8MB \
;     0x0 bootloader.bin 0x8000 partitions.bin \
;     0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
;     0x10000 firmware.bin

[platformio]
default_envs = cardputer-adv

; ---- shared settings, and the all-in-flash baseline build ---------------------
; Platform, board, libraries and flags that every env below inherits. Built by
; itself this is the instrument with all code in flash, which overloads on the
; device: the firmware to flash is env:cardputer-adv further down.
[env:cardputer-adv-flash]
; pioarduino is the community platform that tracks arduino-esp32 3.x; pinned to a
; release tag instead of the floating ".../download/stable/...". (The official
; registry `platform = espressif32` stayed on arduino-esp32 2.0.x / IDF 4.4 up to
; v7.x; since v8.0.0, 2026-10-19, it also ships core 3.3.12 / IDF 5.5.5 -- see
; docs/hardware-notes.md 7.3. So stock `platform = espressif32@8.0.0` should be
; equivalent outside the sandbox, but it has not been built here: it comes from
; the PlatformIO registry, which the sandbox cannot reach. This pin is the one
; every build in this repo was verified with.)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino

; ---- flash layout (these are the board defaults, spelled out on purpose) ----
; default_8MB.csv: nvs 20K | otadata 8K | app0 3.19M @0x10000 | app1 3.19M (OTA)
;                  | "spiffs" data 1.5M @0x670000 | coredump 64K
; The 1.5 MB data partition is what LittleFS.begin() mounts by default (label
; "spiffs"), so song storage needs no custom table. If more is ever needed,
; large_spiffs_8MB.csv gives 5.4 MB of data but only 1.25 MB per app slot.
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs

monitor_speed = 115200

; ---- compiler ----
; -O2 instead of the framework's -Os. C++ standard is left alone: arduino-esp32
; 3.x already compiles with -std=gnu++2a (C++20, a superset of C++17), so no
; "build_unflags = -std=gnu++11 / build_flags = -std=gnu++17" dance is needed.
;
; Floating point (audio DSP on the LX7 single-precision FPU), chosen deliberately:
;   -fno-math-errno     sinf/expf/sqrtf never set errno, so GCC may treat them
;                       as pure (CSE, hoisting) and inline sqrtf. Changes no
;                       values and keeps NaN/inf semantics intact.
;   -fno-trapping-math  the Xtensa FPU never traps; lets GCC if-convert and
;                       schedule FP ops freely. Values unchanged.
;   -ffp-contract=fast  GCC's default in GNU mode, spelled out: a*b+c may become
;                       one MADD.S (fused, one rounding). Faster; device output
;                       differs from the x86 host renders in the last bits only.
;   NOT -ffast-math / -ffinite-math-only / -fno-honor-nans: they let GCC assume
;   no NaN/inf exists and fold std::isfinite(x) to `true`, deleting the engine's
;   NaN guards. NOT -fassociative-math / -freciprocal-math either: they reorder
;   or approximate guarded arithmetic for little gain. NOT
;   -fsingle-precision-constant: it would hide accidental doubles instead of
;   reporting them (-Wdouble-promotion below does that).
build_unflags = -Os
build_flags =
    -O2
    -fno-math-errno
    -fno-trapping-math
    -ffp-contract=fast
    ; Serial -> native USB port (USB-Serial/JTAG CDC), available right from boot.
    ; USB_MODE=1 is already the board default; repeated here to keep the pair together.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; Warnings for OUR code only (src/ and lib/pg). build_src_flags reach src/;
; lib/pg is a library, so it gets the same set through the middleware in
; src/app/pio_pg_flags.py (framework and M5 libraries stay at their defaults).
; -Wdouble-promotion makes every accidental float->double show up.
build_src_flags =
    -Wall
    -Wextra
    -Wdouble-promotion
extra_scripts = pre:src/app/pio_pg_flags.py

; ---- sources ----
; src/platform  hardware layer (audio out, keys, display, storage, system): shared
; src/app       the instrument (this env)
; src/smoke     hardware smoke test (env:smoke)
build_src_filter = -<*> +<platform/> +<app/>

; ---- libraries ----
; [sandbox] Pinned git tags instead of registry names. ORDER MATTERS: a library's
; own dependencies must already be installed (listed above it), otherwise
; PlatformIO asks the registry for them. Stock equivalent:
;     lib_deps =
;         m5stack/M5Cardputer@1.1.1
;         m5stack/M5Unified@0.2.29
;         m5stack/M5GFX@0.2.36
; M5Cardputer >= 1.1.0 supports the Cardputer-Adv; its manifest asks for
; M5Unified "*", M5GFX "*", IRremote "*". M5Unified 0.2.29 needs M5GFX >= 0.2.35.
; (Git tag 1.2.0 of M5Cardputer also exists but still calls itself 1.1.1 and
; changes the keyboard API -- Backspace moves from keysState().del to
; .backspace, Fn becomes a layer -- so it is not used here.)
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.36
    https://github.com/m5stack/M5Unified.git#0.2.29
    https://github.com/Arduino-IRremote/Arduino-IRremote.git#v4.7.1
    https://github.com/m5stack/M5Cardputer.git#1.1.1
; IRremote is only used by M5Cardputer's examples, never by its src/, but it is a
; declared dependency, so it has to be *installed* (above) to keep the resolver
; away from the registry. lib_ignore then keeps it out of the build.
;
; `pg` (lib/pg, the portable engine/UI) is compiled for real in this env: the
; library dependency finder picks it up from the `#include "pg/..."` lines in
; src/app and adds lib/pg/src to the include path.
lib_ignore =
    IRremote

; ---- hardware smoke test ----------------------------------------------------
;   pio run -e smoke -t upload        (see docs/BRINGUP.md)
; Same platform, board, flags and libraries as above (everything is inherited);
; only the application sources differ. Output: .pio/build/smoke/firmware.factory.bin
[env:smoke]
extends = env:cardputer-adv-flash
build_src_filter = -<*> +<platform/> +<smoke/>
; The smoke test uses only pg's HEADERS (contract types such as pg::Framebuffer),
; never its sources, so a half-edited lib/pg can never break it.
build_flags =
    ${env:cardputer-adv-flash.build_flags}
    -Ilib/pg/src
lib_ignore =
    IRremote
    pg
; The reviewed smoke test is built exactly as before (framework warning flags
; only): it printf()s floats on purpose (control rate, never audio).
build_src_flags =
extra_scripts =

; ---- the instrument: audio hot path in internal RAM -------------------------
;   pio run -e cardputer-adv -t upload
; After compiling, tools/pio_audio_ram.py renames the per-quantum DSP functions
; (and, at tier 2, the per-step note-on paths) of lib/pg into .iram1.* sections,
; which the prebuilt IDF linker script places in IRAM. Costs about 45 KB of heap
; 1:1 (IRAM and DRAM share SRAM1). The boot log prints
; "[audio] hot path: IRAM ..." with the measured placement.
;
; Why: measured on the device, the same code run from flash needs over 100% of a
; core in busy passages (the ~38 KB per-quantum code set thrashes the 16 KB
; instruction cache); from IRAM it needs about 30%. env:cardputer-adv-flash is
; the all-in-flash build, kept only as the baseline for that comparison.
[env:cardputer-adv]
extends = env:cardputer-adv-flash
build_flags =
    ${env:cardputer-adv-flash.build_flags}
    -DPG_AUDIO_RAM=2
extra_scripts = pre:tools/pio_audio_ram.py

; ---- the instrument with stereo USB audio (A/B against env:cardputer-adv) ------
;   pio run -e cardputer-adv-usb -t upload          (docs/MANUAL.md "Stereo over USB")
;   pio run -e cardputer-adv-usb -t flashmode       (reboot it into download mode, e.g.
;                                                     before flashing env:cardputer-adv again)
; The same instrument, but the USB port is a composite TinyUSB device: a CDC
; serial port (boot log, r report, [stats], tools/pg) plus a stereo 16-bit UAC1
; input called "Pocket Groove" at the boot-menu sample rate (44.1 or 32 kHz).
; The engine renders STEREO; the jack plays (L+R)/2 (src/platform/usb_audio.*,
; docs/usb-audio.md). tools/pio_audio_ram.py then moves the stereo template
; variants of the hot path to IRAM instead of the mono ones.
;
; USB_MODE=0 gives the USB pins to the USB-OTG controller (TinyUSB) instead of
; the USB-Serial/JTAG controller. CDC_ON_BOOT=0: the firmware starts the USB
; stack itself in setup(), once it has read the sample rate (the audio
; descriptor carries it), so the USB interrupt runs on core 1, away from audio.
; Uploads use the core's 1200-baud touch: the firmware reboots itself into the
; ROM download mode, then esptool flashes over the ROM's USB-Serial/JTAG port.
; If the firmware is wedged: power switch off, hold G0, plug USB, release, upload.
[env:cardputer-adv-usb]
extends = env:cardputer-adv-flash
build_unflags =
    -Os
    -DARDUINO_USB_MODE=1
build_flags =
    -O2
    -fno-math-errno
    -fno-trapping-math
    -ffp-contract=fast
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DPG_USB_AUDIO=1
    -DPG_AUDIO_RAM=2
    '-DUSB_PRODUCT="Pocket Groove"'
    '-DUSB_MANUFACTURER="Pocket Groove"'
extra_scripts =
    pre:tools/pio_audio_ram.py
    post:tools/pio_usb.py
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

; ---- on-device audio profiler ------------------------------------------------
;   pio run -e profile -t upload       (then: pio device monitor, wait ~10 min)
; Runs by itself at boot (no keys), shows progress on the LCD and prints a
; fixed-format report between "===== PG-PROFILE BEGIN" / "END" on USB serial,
; repeated every 20 s. profile-ram: the same with the audio hot path in IRAM
; (PG_AUDIO_RAM=2, as env:cardputer-adv), so the two reports A/B placement.
[env:profile]
extends = env:cardputer-adv-flash
build_src_filter = -<*> +<platform/> +<profile/>
extra_scripts = pre:tools/pio_audio_ram.py

[env:profile-ram]
extends = env:cardputer-adv-flash
build_src_filter = -<*> +<platform/> +<profile/>
build_flags =
    ${env:cardputer-adv-flash.build_flags}
    -DPG_AUDIO_RAM=2
extra_scripts = pre:tools/pio_audio_ram.py

; ---- USB audio spike: stereo USB audio input + CDC serial ---------------------
;   pio run -e usb-audio-spike -t upload      (docs/usb-audio.md section 2)
; The Mac sees a composite device: "Pocket Groove" stereo 16-bit UAC1 input
; (44.1 kHz, or 32 kHz after a G0 tap) and a CDC serial port for the logs.
; The codec keeps playing the mono sum. Spike sources only (src/usbspike: test
; signal and status) on top of the instrument's own USB module
; (src/platform/usb_audio.*, usb_trim.c) plus plat::audio and plat::display;
; no lib/pg, no src/app.
;
; USB_MODE=0 hands the USB pins to the USB-OTG controller (TinyUSB, prebuilt
; with the audio class in arduino-esp32 3.3.12) instead of the USB-Serial/JTAG
; controller every other env uses. Consequences for flashing: the firmware
; must reboot itself into download mode on request, which the core does on a
; 1200-baud "touch" of the CDC port (USBCDC::_onLineCoding) -- hence the two
; board_upload options, the same ones Adafruit's TinyUSB S3 boards use. If the
; firmware is wedged: power switch off, hold G0, plug USB, release, upload.
[env:usb-audio-spike]
extends = env:cardputer-adv-flash
build_src_filter = -<*> +<platform/audio_out.cpp> +<platform/display.cpp> +<platform/usb_audio.cpp> +<platform/usb_trim.c> +<usbspike/>
build_unflags =
    -Os
    -DARDUINO_USB_MODE=1
build_flags =
    -O2
    -fno-math-errno
    -fno-trapping-math
    -ffp-contract=fast
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DPG_USB_AUDIO=1
    '-DUSB_PRODUCT="Pocket Groove"'
    '-DUSB_MANUFACTURER="Pocket Groove"'
    -Ilib/pg/src
lib_ignore =
    IRremote
    pg
build_src_flags =
    -Wall
    -Wextra
    -Wdouble-promotion
extra_scripts = post:tools/pio_usb.py
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes

; The same spike without TinyUSB (Serial on the USB-Serial/JTAG port as in
; every other env, usbaudio:: compiled as stubs): the RAM / flash baseline the
; USB stack is measured against (docs/usb-audio.md, "RAM and flash cost").
; Flashes and runs (tone on the jack, status on the LCD), but has no USB audio.
[env:usb-audio-spike-nousb]
extends = env:cardputer-adv-flash
build_src_filter = -<*> +<platform/audio_out.cpp> +<platform/display.cpp> +<platform/usb_audio.cpp> +<usbspike/>
build_flags =
    ${env:cardputer-adv-flash.build_flags}
    -DUSBSPIKE_NO_USB=1
    -Ilib/pg/src
lib_ignore =
    IRremote
    pg
build_src_flags =
    -Wall
    -Wextra
    -Wdouble-promotion
extra_scripts =
